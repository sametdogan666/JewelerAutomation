<div class="dashboard-page">
  <div class="page-header">
    <h1 class="page-title">
      <mat-icon>dashboard</mat-icon>
      Panel
    </h1>
    <p class="page-subtitle">DOĞAN KUYUMCULUK - Anlık durum ve finans analizi</p>
  </div>

  <!-- Main Widgets Grid -->
  <div class="main-widgets-grid">
    <!-- Kasa & Finansal Durum Widget -->
    <app-safe-status-widget></app-safe-status-widget>

    <!-- Kâr Analizi Widget -->
    <app-profit-widget></app-profit-widget>

    <!-- Hızlı Erişim Widget -->
    <mat-card class="quick-actions-widget">
      <mat-card-header>
        <div class="widget-header">
          <mat-icon class="widget-icon">flash_on</mat-icon>
          <h2 class="widget-title">Hızlı Erişim</h2>
        </div>
      </mat-card-header>
      <mat-card-content>
        <div class="actions-grid">
          <a mat-raised-button routerLink="/transactions/new" class="action-btn action-btn--transaction">
            <mat-icon>add_shopping_cart</mat-icon>
            <span>Yeni İşlem</span>
          </a>
          <a mat-raised-button routerLink="/customers/new" class="action-btn action-btn--customer">
            <mat-icon>person_add</mat-icon>
            <span>Yeni Cari</span>
          </a>
          <a mat-raised-button routerLink="/kasa" class="action-btn action-btn--safe">
            <mat-icon>account_balance_wallet</mat-icon>
            <span>Kasa Detayı</span>
          </a>
          <a mat-raised-button routerLink="/customers" class="action-btn action-btn--list">
            <mat-icon>people</mat-icon>
            <span>Cariler ({{ customerCount() || 0 }})</span>
          </a>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
