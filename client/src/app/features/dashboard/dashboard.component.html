<!-- isLoading tam sayfayı sarmaz; mor kutular her zaman DOM'da (veri widget içinde computed). -->
<div class="dashboard-page">
  <div class="page-header">
    <h1 class="page-title">
      <mat-icon>dashboard</mat-icon>
      Panel
    </h1>
    <p class="page-subtitle">DOĞAN KUYUMCULUK - Anlık durum ve finans analizi</p>
  </div>

  <div class="dashboard-stack">
    <!-- Hızlı Erişim: özet kartların üstünde, tek görsel blok -->
    <mat-card class="quick-actions-widget quick-actions-widget--top">
      <mat-card-header>
        <div class="widget-header quick-actions-header">
          <mat-icon class="widget-icon">flash_on</mat-icon>
          <div class="quick-actions-titles">
            <h2 class="widget-title">Hızlı Erişim</h2>
            <p class="widget-subhint">Sık kullanılan işlemler — nakit bağlama ve panel özeti aynı hizada</p>
          </div>
        </div>
      </mat-card-header>
      <mat-card-content>
        <div class="actions-grid">
          <button
            mat-raised-button
            color="primary"
            type="button"
            class="action-btn action-btn--peg"
            matTooltip="Nakit Bağlama ve Dönemsel Analiz"
            (click)="openProfitAnalysis()">
            <mat-icon>attach_money</mat-icon>
            <span>Nakit Bağlama</span>
          </button>
          <a mat-raised-button routerLink="/transactions/new" class="action-btn action-btn--transaction">
            <mat-icon>add_shopping_cart</mat-icon>
            <span>Yeni İşlem</span>
          </a>
          <a mat-raised-button routerLink="/customers/new" class="action-btn action-btn--customer">
            <mat-icon>person_add</mat-icon>
            <span>Yeni Cari</span>
          </a>
          <a mat-raised-button routerLink="/kasa" class="action-btn action-btn--safe">
            <mat-icon>account_balance_wallet</mat-icon>
            <span>Kasa Detayı</span>
          </a>
          <a mat-raised-button routerLink="/customers" class="action-btn action-btn--list">
            <mat-icon>people</mat-icon>
            <span>Cariler ({{ customerCount() || 0 }})</span>
          </a>
          <button
            mat-stroked-button
            type="button"
            class="action-btn action-btn--rate"
            matTooltip="Bugün için HAS kuru (canlı API yoksa)"
            (click)="openManualGoldRate()">
            <mat-icon>tune</mat-icon>
            <span>Manuel Kur Ayarla</span>
          </button>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Özet kartları: Finansal durum + sermaye — kalan yüksekliği paylaşır -->
    <div class="summary-charts-grid">
      <app-safe-status-widget class="summary-panel" [dashboard]="dashboardData()" />
      <app-profit-widget class="summary-panel" [dashboard]="dashboardData()" />
    </div>
  </div>
</div>
